<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Calculadoras · Exato Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: abas Salário | Rescisão; à esquerda o formulário, à direita o demonstrativo (holerite ou TRCT simulado) com memória de cálculo. */
:root{
  --red:#C00000; --red-hi:#e01515; --red-soft:rgba(192,0,0,.07);
  --bg:#f3f3f5; --surf:#ffffff; --surf2:#f7f7f9; --ink:#16171a; --mute:#5f626b; --line:#e2e3e8; --hover:#fbf4f4;
  --ok:#14804f; --ok-bg:#e2f4ea; --at:#9a5b00; --at-bg:#fff1d6; --er:#b00000; --er-bg:#fde6e6;
  --f-disp:"Sora","Segoe UI",system-ui,sans-serif; --f-body:"Manrope","Segoe UI",system-ui,sans-serif; --f-mono:"JetBrains Mono",Consolas,ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --red-hi:#ff3b3b; --red-soft:rgba(255,59,59,.09); --bg:#141416; --surf:#1d1d20; --surf2:#232327; --ink:#f1f1f3; --mute:#a3a5ad; --line:#2f2f34; --hover:#261b1b;
  --ok:#3fbf86; --ok-bg:rgba(63,191,134,.14); --at:#e8a531; --at-bg:rgba(232,165,49,.14); --er:#ff6b6b; --er-bg:rgba(255,90,90,.14); color-scheme:dark}}
:root[data-theme="dark"]{
  --red-hi:#ff3b3b; --red-soft:rgba(255,59,59,.09); --bg:#141416; --surf:#1d1d20; --surf2:#232327; --ink:#f1f1f3; --mute:#a3a5ad; --line:#2f2f34; --hover:#261b1b;
  --ok:#3fbf86; --ok-bg:rgba(63,191,134,.14); --at:#e8a531; --at-bg:rgba(232,165,49,.14); --er:#ff6b6b; --er-bg:rgba(255,90,90,.14); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red-hi);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding-inline:24px;padding-block:22px 60px;display:grid;gap:16px}
h1{margin:0;font:800 1.6rem/1.15 var(--f-disp);letter-spacing:-.02em}
h2{margin:0;font:700 1.05rem/1.3 var(--f-disp)}
h3{margin:0;font:700 .74rem var(--f-disp);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.lead{margin:4px 0 0;color:var(--mute);font-size:.9rem;max-width:84ch}
.note{font-size:.8rem;color:var(--mute);margin:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;padding:10px 16px;font:700 .92rem var(--f-disp);color:var(--mute);cursor:pointer;border-bottom:3px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red-hi)}
.cols{display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:16px;align-items:start}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:12px;min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fgrid .full{grid-column:1/-1}
.fld{display:grid;gap:4px;font-size:.74rem;font-weight:700;color:var(--mute);min-width:0}
.fld input,.fld select{background:var(--surf2);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:.92rem;font-weight:500;color:var(--ink);width:100%;min-width:0}
.fld small{font-weight:500}
.chk{display:flex;gap:8px;align-items:center;font-size:.86rem;font-weight:600;color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:9px 16px;font:700 .86rem var(--f-disp);cursor:pointer;background:var(--red);color:#fff;white-space:nowrap}
.btn:hover{background:var(--red-hi)}
.btn.ghost{background:var(--surf);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--red-hi);color:var(--red-hi)}
.btn.sm{padding:5px 10px;font-size:.78rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lin{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:8px;align-items:end}
.lin.v{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto}
.x{border:1px solid var(--line);background:var(--surf);border-radius:8px;width:34px;height:36px;cursor:pointer;color:var(--mute)}
.x:hover{color:var(--er);border-color:var(--er)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surf2);min-width:0}
.kpi b{display:block;font:700 1.2rem var(--f-mono);white-space:nowrap}
.kpi span{font-size:.74rem;color:var(--mute)}
.kpi.main{border-color:var(--red-hi)} .kpi.main b{color:var(--red-hi)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{font:700 10px var(--f-disp);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);text-align:left;padding:8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.n,th.n{text-align:right;font-family:var(--f-mono);white-space:nowrap}
td small{display:block;color:var(--mute);font-size:.74rem}
tr.tot td{font-weight:800;border-top:2px solid var(--line)}
tr.liq td{font-weight:800;color:var(--red-hi);font-size:1rem}
.tbox{overflow-x:auto}
.avisos{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.avisos li{display:flex;gap:8px;font-size:.84rem} .avisos li::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;margin-top:6px;background:var(--at)}
.avisos li.er::before{background:var(--er)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:min(92vw,620px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.88rem;z-index:40}
.only-print{display:none}
@media (max-width:1000px){.cols{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.wrap{padding-inline:16px}.fgrid{grid-template-columns:1fr}}
@media print{
  @page{size:A4;margin:14mm 12mm}
  body{background:#fff!important;color:#111!important;font-size:11.5px}
  .no-print,.tabs,.toast,.fx-bg{display:none!important}
  .wrap{padding:0;max-width:none}
  .cols{display:block} .cols>.card:first-child{display:none}
  .card{border:0;padding:0}
  .only-print{display:block}
}
</style>
<link rel="stylesheet" href="../nucleo/tema-exato.css">
</head><body>
<div class="wrap">
  <header class="no-print">
    <h1>Calculadoras de DP</h1>
    <p class="lead">Para qualquer pessoa ou empresa, cliente ou não: nada é gravado nem precisa de cadastro. Use as tabelas oficiais do ano e gere o demonstrativo em PDF ou o texto para o WhatsApp.</p>
  </header>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="t-sal" aria-selected="true" data-aba="sal">Salário bruto e líquido</button>
    <button class="tab" role="tab" id="t-res" aria-selected="false" data-aba="res">Rescisão</button>
  </div>

  <!-- ====== SALÁRIO ====== -->
  <div class="cols" id="aba-sal">
    <div class="card">
      <div class="fgrid">
        <label class="fld full">Para quem é a simulação (opcional)<input id="s-quem" placeholder="ex.: Empresa X · cargo de auxiliar"></label>
        <label class="fld">Salário base (R$)<input id="s-sal" inputmode="decimal" placeholder="ex.: 2.500,00"></label>
        <label class="fld">Horas por mês<input id="s-hm" inputmode="numeric" value="220"><small>220 = 44h semanais</small></label>
        <label class="fld">Insalubridade<select id="s-ins"><option value="0">Não tem</option><option value="10">Grau mínimo (10%)</option><option value="20">Grau médio (20%)</option><option value="40">Grau máximo (40%)</option></select></label>
        <label class="fld">Base da insalubridade<select id="s-insb"><option value="minimo">Salário mínimo</option><option value="salario">Salário base</option><option value="valor">Outro valor (CCT)</option></select></label>
        <label class="fld" id="s-insvw" hidden>Valor da base (R$)<input id="s-insv" inputmode="decimal"></label>
        <label class="chk full"><input type="checkbox" id="s-per"> Periculosidade (30% do salário base)</label>
        <label class="fld">Quebra de caixa<select id="s-qct"><option value="valor">Valor fixo (R$)</option><option value="pct">% do salário</option></select></label>
        <label class="fld">Valor ou %<input id="s-qcv" inputmode="decimal" placeholder="vazio = não tem"></label>
      </div>
      <h3>Horas extras</h3>
      <div id="s-he" style="display:grid;gap:8px"></div>
      <div class="row"><button class="btn ghost sm" type="button" data-he="50">+ HE 50%</button><button class="btn ghost sm" type="button" data-he="60">+ HE 60%</button><button class="btn ghost sm" type="button" data-he="100">+ HE 100%</button><button class="btn ghost sm" type="button" data-he="">+ outro %</button></div>
      <div class="fgrid">
        <label class="fld">Horas noturnas<input id="s-noth" inputmode="decimal" placeholder="já reduzidas"></label>
        <label class="fld">Adicional noturno (%)<input id="s-notp" inputmode="decimal" value="20"></label>
        <label class="fld">Mês (para o DSR)<input id="s-comp" type="month"></label>
        <label class="fld">Feriados no mês (fora domingo)<input id="s-fer" inputmode="numeric" value="0"></label>
      </div>
      <h3>Outros proventos</h3>
      <div id="s-out" style="display:grid;gap:8px"></div>
      <div class="row"><button class="btn ghost sm" type="button" id="s-addO">+ provento (comissão, prêmio…)</button><button class="btn ghost sm" type="button" id="s-addN">+ verba sem desconto (ajuda de custo)</button></div>
      <h3>Descontos</h3>
      <div class="fgrid">
        <label class="chk full"><input type="checkbox" id="s-inss" checked> Calcular INSS</label>
        <label class="chk full"><input type="checkbox" id="s-fgts" checked> Calcular FGTS</label>
        <label class="fld">Dependentes para IR<input id="s-dep" inputmode="numeric" value="0"></label>
        <label class="fld">Pensão alimentícia (R$)<input id="s-pen" inputmode="decimal"></label>
        <label class="chk"><input type="checkbox" id="s-vt"> Vale-transporte (6%)</label>
        <label class="fld">Custo do VT no mês (R$)<input id="s-vtc" inputmode="decimal" placeholder="limita o desconto"></label>
      </div>
      <div id="s-desc" style="display:grid;gap:8px"></div>
      <div class="row"><button class="btn ghost sm" type="button" id="s-addD">+ desconto (adiantamento, plano…)</button></div>
      <h3>Custo para a empresa</h3>
      <div class="fgrid">
        <label class="fld">Regime<select id="s-reg"><option value="simples">Simples Nacional (anexos I a III e V)</option><option value="fora">Fora do Simples ou Anexo IV</option></select></label>
        <label class="fld">Ano das tabelas<select id="s-ano"></select></label>
        <label class="fld s-fora">RAT × FAP (%)<input id="s-rat" inputmode="decimal" value="2"></label>
        <label class="fld s-fora">Terceiros (%)<input id="s-ter" inputmode="decimal" value="5,8"></label>
      </div>
    </div>
    <div class="card" id="s-res"></div>
  </div>

  <!-- ====== RESCISÃO ====== -->
  <div class="cols" id="aba-res" hidden>
    <div class="card">
      <div class="fgrid">
        <label class="fld full">Empregado / empresa (opcional)<input id="r-quem" placeholder="ex.: João · Empresa X"></label>
        <label class="fld">Último salário (R$)<input id="r-sal" inputmode="decimal" placeholder="ex.: 2.500,00"></label>
        <label class="fld">Média de variáveis (R$/mês)<input id="r-med" inputmode="decimal" placeholder="HE, comissões, adicionais"><small>média dos últimos 12 meses</small></label>
        <label class="fld">Admissão<input id="r-adm" type="date"></label>
        <label class="fld">Último dia trabalhado<input id="r-sai" type="date"></label>
        <label class="fld">Insalubridade<select id="r-ins"><option value="0">Não tem</option><option value="10">Grau mínimo (10%)</option><option value="20">Grau médio (20%)</option><option value="40">Grau máximo (40%)</option></select></label>
        <label class="fld">Base da insalubridade<select id="r-insb"><option value="minimo">Salário mínimo</option><option value="salario">Salário base</option><option value="valor">Outro valor (CCT)</option></select></label>
        <label class="fld" id="r-insvw" hidden>Valor da base (R$)<input id="r-insv" inputmode="decimal"></label>
        <label class="chk full"><input type="checkbox" id="r-per"> Periculosidade (30% do salário base)</label>
        <label class="fld">Quebra de caixa<select id="r-qct"><option value="valor">Valor fixo (R$)</option><option value="pct">% do salário</option></select></label>
        <label class="fld">Valor ou %<input id="r-qcv" inputmode="decimal" placeholder="vazio = não tem"></label>
        <label class="fld full">Motivo<select id="r-mot"></select></label>
        <label class="fld full" id="r-avw">Aviso prévio<select id="r-av"></select></label>
        <label class="fld full" id="r-fimw" hidden>Fim previsto do contrato a prazo<input id="r-fim" type="date"></label>
        <label class="chk full"><input type="checkbox" id="r-semav"> Não calcular o aviso prévio</label>
        <label class="chk full"><input type="checkbox" id="r-semsal"> Não calcular o saldo de salário do mês (já pago na folha)</label>
      </div>
      <h3>Férias e 13º</h3>
      <div class="fgrid">
        <label class="fld">Períodos de férias vencidas não gozadas<input id="r-fv" inputmode="numeric" value="0"><small id="r-fvh"></small></label>
        <label class="fld">Desses, quantos já em dobro<input id="r-fd" inputmode="numeric" value="0"><small>período concessivo vencido</small></label>
        <label class="fld">Faltas injustificadas no período atual<input id="r-fal" inputmode="numeric" value="0"><small>reduzem as férias (art. 130)</small></label>
        <label class="fld">13º já pago (R$)<input id="r-ad13" inputmode="decimal" placeholder="1ª parcela ou parte já paga"><small>entra como desconto</small></label>
        <label class="fld">Férias já pagas (R$)<input id="r-fpag" inputmode="decimal" placeholder="férias pagas antecipadamente"><small>entra como desconto</small></label>
      </div>
      <h3>Encargos e FGTS</h3>
      <div class="fgrid">
        <label class="chk full"><input type="checkbox" id="r-inss" checked> Calcular INSS</label>
        <label class="chk full"><input type="checkbox" id="r-fgtsc" checked> Calcular FGTS</label>
        <label class="fld">Dependentes para IR<input id="r-dep" inputmode="numeric" value="0"></label>
        <label class="fld">Pensão alimentícia (R$)<input id="r-pen" inputmode="decimal"></label>
        <label class="fld full">Saldo do FGTS para fins rescisórios (R$)<input id="r-fgts" inputmode="decimal" placeholder="do extrato do FGTS Digital; vazio = estimativa"></label>
        <label class="fld">Ano das tabelas<select id="r-ano"></select></label>
      </div>
      <div id="r-out" style="display:grid;gap:8px"></div>
      <div class="row"><button class="btn ghost sm" type="button" id="r-addO">+ outro provento</button><button class="btn ghost sm" type="button" id="r-addD">+ outro desconto</button></div>
    </div>
    <div class="card" id="r-res"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="../nucleo/pdf-relatorio.js" charset="utf-8"></script>
<script src="../nucleo/flow-dados.js" charset="utf-8"></script>
<script src="../nucleo/folha-auditoria.js" charset="utf-8"></script>
<script src="../nucleo/calculos-dp.js" charset="utf-8"></script>
<script>
"use strict";
const A=window.FolhaAuditoria, C=window.CalculosDP;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const brl=A.brl, b2=v=>brl(v).replace("R$ ",""), fmt=s=>s?s.split("-").reverse().join("/"):"—";
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,4200);}
const ANOS=Object.keys(A.TABELAS).sort(), ULT=ANOS[ANOS.length-1];
["s-ano","r-ano"].forEach(id=>{ $(id).innerHTML=ANOS.map(a=>`<option>${a}</option>`).join(""); $(id).value=ULT; });
const hoje=new Date(); $("s-comp").value=hoje.getFullYear()+"-"+String(hoje.getMonth()+1).padStart(2,"0");
let ABA="sal", TXT="", PDFDOC=null;
// só redesenha o resultado quando ele muda: ao clicar num botão logo depois de digitar, o campo perde o foco,
// o "change" recalculava e trocava o botão por outro igual, e o clique se perdia
function pintar(id,html){ const el=$(id); if(el.__h===html&&el.innerHTML===el.__n) return; el.innerHTML=html; el.__h=html; el.__n=el.innerHTML; }

// ---------- linhas dinâmicas ----------
function linha(box,tipo,dados){
  const d=document.createElement("div"); d.className="lin"+(tipo==="he"?"":" v"); d.dataset.t=tipo;
  d.innerHTML=tipo==="he"
    ?`<label class="fld">Adicional (%)<input data-k="pct" inputmode="decimal" value="${esc(dados.pct??"")}" placeholder="ex.: 75"></label><label class="fld">Horas<input data-k="horas" inputmode="decimal" placeholder="ex.: 10"></label><button class="x" type="button" aria-label="Remover">×</button>`
    :`<label class="fld">${tipo==="n"?"Verba sem desconto":tipo==="d"||tipo==="rd"?"Desconto":"Provento"}<input data-k="desc" value="${esc(dados.desc||"")}" placeholder="descrição"></label><label class="fld">Valor (R$)<input data-k="valor" inputmode="decimal"></label><button class="x" type="button" aria-label="Remover">×</button>`;
  d.querySelector(".x").onclick=()=>{ d.remove(); calcular(); };
  box.append(d); const f=d.querySelector(tipo==="he"&&dados.pct!==""&&dados.pct!=null?'[data-k="horas"]':"input"); f&&f.focus();
}
const ler=(box,tipo)=>[...$(box).querySelectorAll(`.lin[data-t="${tipo}"]`)].map(l=>Object.fromEntries([...l.querySelectorAll("input")].map(i=>[i.dataset.k,i.value])));
document.querySelectorAll("[data-he]").forEach(b=>b.onclick=()=>linha($("s-he"),"he",{pct:b.dataset.he}));
$("s-addO").onclick=()=>linha($("s-out"),"o",{}); $("s-addN").onclick=()=>linha($("s-out"),"n",{});
$("s-addD").onclick=()=>linha($("s-desc"),"d",{});
$("r-addO").onclick=()=>linha($("r-out"),"ro",{}); $("r-addD").onclick=()=>linha($("r-out"),"rd",{});
linha($("s-he"),"he",{pct:50}); $("s-sal").focus();

// ---------- salário ----------
function calcSalario(){
  const T=A.TABELAS[$("s-ano").value];
  $("s-insvw").hidden=$("s-insb").value!=="valor";
  document.querySelectorAll(".s-fora").forEach(x=>x.hidden=$("s-reg").value!=="fora");
  const e={salario:$("s-sal").value,horasMes:$("s-hm").value,insal:{grau:$("s-ins").value,base:$("s-insb").value,valorBase:$("s-insv").value},peric:$("s-per").checked,quebra:{tipo:$("s-qct").value,valor:$("s-qcv").value},
    he:ler("s-he","he"),noturno:{horas:$("s-noth").value,pct:$("s-notp").value},comp:$("s-comp").value,feriados:$("s-fer").value,
    outrosTrib:ler("s-out","o"),naoTrib:ler("s-out","n"),semInss:!$("s-inss").checked,semFgts:!$("s-fgts").checked,dependentes:$("s-dep").value,pensao:$("s-pen").value,vt:{usa:$("s-vt").checked,custo:$("s-vtc").value},
    descontos:ler("s-desc","d"),regime:$("s-reg").value,rat:$("s-rat").value,terceiros:$("s-ter").value};
  if(!C.num(e.salario)){ $("s-res").innerHTML='<p class="note">Digite o salário base para ver o holerite simulado.</p>'; TXT=""; return; }
  const r=C.simularSalario(e,T), quem=$("s-quem").value.trim();
  const P=[["Salário base",`${C.num(e.horasMes)||220} h`,C.num(e.salario)]];
  if(r.insal) P.push(["Adicional de insalubridade",`${e.insal.grau}% de ${e.insal.base==="salario"?"salário base":e.insal.base==="valor"?"base informada":"salário mínimo"}`,r.insal]);
  if(r.peric) P.push(["Adicional de periculosidade","30% do salário",r.peric]);
  if(r.quebra) P.push(["Quebra de caixa",r.qTxt,r.quebra]);
  r.he.forEach(h=>P.push([`Horas extras ${h.pct}%`,`${String(h.horas).replace(".",",")} h × ${b2(r.vh*(1+h.pct/100))}`,h.valor]));
  if(r.noturno.valor) P.push([`Adicional noturno ${r.noturno.pct}%`,`${r.noturno.horas} h`,r.noturno.valor]);
  if(r.dsr) P.push(["DSR sobre horas extras e adicional noturno",`÷ ${r.dias.uteis} úteis × ${r.dias.dsr}`,r.dsr]);
  r.outrosT.forEach(o=>P.push([o.desc,"",o.valor])); r.naoT.forEach(o=>P.push([o.desc,"sem INSS/IR/FGTS",o.valor]));

// PDF gerado no próprio Flow (a impressão do navegador fica bloqueada dentro do Flow)
async function baixarPdf(btn){
  const d=PDFDOC; if(!d||!TXT){ toast("Preencha a simulação antes de gerar o PDF."); return; }
  if(!window.PdfRel||!window.PDFLib){ toast("O gerador de PDF não carregou. Confira a internet e recarregue a página."); return; }
  const tx=btn.textContent; btn.disabled=true; btn.textContent="Gerando PDF…";
  try{
    const r=await PdfRel.criar({titulo:d.titulo+(d.quem?" – "+d.quem:""),sub:`${d.titulo} · ${new Date().toLocaleDateString("pt-BR")}`,rodape:"Simulação – tabelas de "+d.ano});
    r.h1(d.titulo+(d.quem?" · "+d.quem:"")); r.p(`Tabelas oficiais de ${d.ano} · gerado em ${new Date().toLocaleDateString("pt-BR")}`,{cor:"suave",tam:8.5,depois:6});
    (d.intro||[]).forEach(t=>r.p(t,{tam:9}));
    r.kpis(d.kpis.map(([v,t,c])=>["R$ "+v,t,c||"tinta"]));
    for(const [tit,rows] of d.tabelas){ r.h2(tit); r.tabela(["Descrição","Referência","Valor (R$)"],rows); }
    if(d.notas.length){ r.h2("Observações"); r.lista(d.notas,{tam:8.5}); }
    r.p("Simulação para referência: não substitui o cálculo da folha nem o TRCT. Exato Soluções Contábeis.",{cor:"suave",tam:8});
    const bytes=await r.salvar();
    const nome=d.nome+(d.quem?"_"+d.quem.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9]+/g,"_").replace(/^_|_$/g,"").slice(0,40):"")+"_"+new Date().toISOString().slice(0,10)+".pdf";
    const dl=window.FlowDados&&await FlowDados.use("downloads");
    if(!dl){ toast("Download indisponível nesta visualização. Abra o Flow pelo link do claude.ai."); return; }
    await dl.save({filename:nome,data:new Blob([bytes],{type:"application/pdf"})}); toast("PDF salvo: "+nome);
  }catch(x){ console.error(x); toast(x&&x.code==="declined"?"Download cancelado.":"Não consegui gerar o PDF."+(x&&x.message?" ("+x.message+")":"")); }
  finally{ btn.disabled=false; btn.textContent=tx; }
}

document.addEventListener("input",e=>{ if(e.target.closest(".cols")) calcular(); });

});

window.addEventListener("message",e=>{ if(e.origin===location.origin&&e.data&&e.data.flow){ if(e.data.flow==="simular") aba("sal"); if(e.data.flow==="rescisao") aba("res"); } });
if(/rescis/.test(location.hash)) aba("res"); else calcular();
